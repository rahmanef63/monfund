[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"

solc_version = "0.8.28"
evm_version = "shanghai"
optimizer = true
optimizer_runs = 200
via_ir = false
bytecode_hash = "ipfs"

# scripts/make-verify-payload.mjs reads out/build-info/*.json for standard-json
# verification input. Emitting it by default means a plain `forge build` is enough —
# it is an extra artifact file, not a compiler setting, so bytecode is unaffected.
build_info = true

remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]

[rpc_endpoints]
monad_testnet = "https://testnet-rpc.monad.xyz"

# Monad testnet — chain id 10143.
# See https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
